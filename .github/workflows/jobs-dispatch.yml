# 找工人·接活 定时任务（11/20 新增，独立文件；不改已有的 event-reminders.yml 和 vercel.json）：
# - 每 15 分钟：/api/cron/jobs?task=dispatch（漏发的第一批、24 小时没人联系发第二批、排队的 CSLB 比对）
# - 每天 14:00 UTC（洛杉矶早上 6/7 点）：?task=daily（14 天到期下架、第 12 天续期提醒、第 7 天回访、90 天复核）
# - 每周二 16:00 UTC：?task=weekly（已通过的 A 类接活人重新对 CSLB 官方总表）
# 沿用仓库已有的 Secrets REMINDER_CRON_SECRET（接口本来就认它），不新增密钥。
name: jobs-dispatch
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * 2'
  workflow_dispatch:
    inputs:
      task:
        description: 'dispatch / daily / weekly'
        required: false
        default: 'dispatch'
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger jobs cron
        env:
          SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TASK: ${{ github.event.inputs.task }}
        run: |
          if [ -z "$SECRET" ]; then echo "REMINDER_CRON_SECRET not set"; exit 0; fi
          task="${INPUT_TASK:-dispatch}"
          if [ "$SCHEDULE" = "0 14 * * *" ]; then task=daily; fi
          if [ "$SCHEDULE" = "0 16 * * 2" ]; then task=weekly; fi
          code=$(curl -s -m 290 -o /tmp/out.json -w '%{http_code}' -X POST -H "Authorization: Bearer $SECRET" "https://sinoamericanrec.org/api/cron/jobs?task=$task")
          echo "task=$task http=$code"; cat /tmp/out.json; echo
          test "$code" = "200"
