  - discriminant: sectionHeading
    value:
      text: 地税那一百多个基点
  - discriminant: prose
    value:
      md: |-
        加州对可负担住房的地税豁免叫福利豁免（welfare exemption），依据是《税收与税务法》第 214 条 (g) 款。路径有两条。一条是房产由符合条件的非营利组织直接持有，按"九成以上租户为低收入"的口径申请，法律对这一口径设有豁免评估值上限。另一条是有限合伙持有：管理普通合伙人（GP）必须是符合条件的非营利组织，并且按州税务委员会第 140.1 号规则，这个非营利在合伙里要有实质的管理权和管理职责，不能只挂名；此外，项目还要有政府贷款、债券或补助并受租金限制，或者取得低收入住房税收抵免，再加上监管协议或契约限制，再经州税务委员会清关、县估税官核定。一个纯私人融资、市场化开发商全资持有的 ED1 项目，一般够不着这个豁免。

        放回模型：地税全额计入是 5.9%，豁免是 7.1%。同一栋楼、同一张租金表、同一份成本，差的是所有权和融资结构。

        所以这一百多个基点不取决于楼，取决于结构：愿不愿意让一个非营利坐进 GP 的位置，愿不愿意为了豁免去接政府融资或税收抵免，把一部分控制权和现金流分出去，换年年省下的地税。市场化开发商第一次做 ED1，往往在这一步犹豫。犹豫的成本可以算出来：基准情景下每年 16 万美元，按 5.5% 的资本化率估值，相当于约 300 万美元的资产价值；在 65% 贷款价值比的情景下，可贷额相差约 200 万美元。

        联动费（Affordable Housing Linkage Fee，可负担住房联动费）是同一类问题，规模小得多。这是洛杉矶 2017 年底建立的收费制度，新建项目在取得建筑许可前，按新增面积、项目规模和所在市场分区计征，费率每年 7 月按通胀调整，2026 年 7 月已再次上调，具体金额以建筑许可签发时有效的费率表为准。低收入单元占两成以上的租赁项目可以豁免，100% 可负担项目在豁免之列。但豁免要申请，批下来之前，保守的做法是全额计入。

        这里顺便说一句我们自己的做法。做 ED1 的测算表，地税、联动费这些可能免掉的钱，我们一律先按要交的算。别人的模型靠乐观假设撑收益，把可能免掉的税全额计入还站得住，才是这类项目的底气。豁免落地那天，收益率往上走，算意外之喜；模型不靠它。
  - discriminant: sectionHeading
    value:
      text: 谁在建，谁在卖
  - discriminant: prose
    value:
      md: |-
        回到批文缺口。八千套拿到了施工许可，其中一部分已经建成，它们给了这个模式最真实的一组答案。

        Bisnow 今年 6 月写了一个案例。开发商 Generation Real Estate Partners 是做市场化公寓出身的，从没做过 100% 可负担项目。他们在西洛杉矶 Sawtelle 一块原本只能建联排别墅的地上，用 ED1 做了 44 套，租金档最高到 120% AMI，前期 12 个月。中间一个邻居以规避环评为由对批文提出上诉，三个月后上诉被驳回，邻居又起诉了市政府，项目照建，整体大约耽误了几个月。相关程序以法院最终文件为准。

        楼建成后整体出售，买家是市住房管理局（HACLA），成交价 1,670 万美元，每套约 37.9 万美元。按开发商在报道里的复盘，100% 可负担项目的收入审核、年度认证和监管报告，对一家市场化公寓开发商是全新的运营能力，这是他们选择出售的原因之一。

        这个案例把 ED1 的退出讲透了。买家是持有型的专业机构，不是散户；价格按受限租金的现金流定，不按周边市场化公寓的可比价；卖家能卖出去，是因为楼已经建成、租金契约已经备案，买家买的是一份确定的现金流。项目的合伙人事后说，如果今天再来一次，他们不会再走 ED1，因为 2025 年之后州和市层面出了几个新工具，同样走非裁量审批、同样快，而且更贴近市场化开发商的路数。

        Century Housing 的建设贷款负责人说得更直白：从她桌上过的 ED1 项目已经明显变少，兴趣过了峰值。

        把这些放在一起，缺口两边的画像就清楚了。留在好的那一边的，是有可负担住房运营经验、资金路径提前锁定、选址在租金上限确实低于市场的团队。掉在另一边的，是把 ED1 当成"更快的市场化开发"来做的团队，他们拿到了批文，然后在融资、成本和运营能力上停了下来。
