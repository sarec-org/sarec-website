  - discriminant: prose
    value:
      md: |-
        两条完全不同的法律理由，指向同一个产品设计：整体持有。

        对整体持有的出租型项目，严格意义上的资产退出只有一条：整栋出售。买家池是可负担住房的专业持有者、非营利组织和公共机构，估值按受限租金的净营业收入除以资本化率，不按市场租金。再融资不是资产退出，是资本回收：稳定出租后，银行按净营业收入和估值发放长期贷款，偿还建设贷之后的净额返还股东，产权还在自己手里。这里沿用模式②的口径：贷款额不等于股东净回款，新贷款先还旧贷和交易费用，剩下的才是回笼的资本。逐套出售不是本文出租型模型的基础路径：条例没有在法律上一概禁止出售型项目，但分割申请本身不享受快批，还要另行满足分割审批、可负担出售价格、产权图和契约要求。

        多说一句估值口径。Sawtelle 那个案例每套 37.9 万美元，放在我们的情景模型里，基准情景的估值每套只有 24 万到 29 万美元。可能的原因包括西洛杉矶的区位、更高的租金档、项目已经建成、契约条件和公共机构买方的需求；没有成交时的完整承销数据，没法把价差精确拆给其中哪一项。不要拿那个数字去套自己的项目。
  - discriminant: sectionHeading
    value:
      text: 风险清单
  - discriminant: prose
    value:
      md: |-
        每一条都带着不确定性，这是这类文章的规矩，也是这类项目的实情。

        租金锚在表上，表可上可下，实际还要跟市场比低。ED1 项目的合同租金不能超过住房局指定表格的上限：上限低于市场时，契约限制收入；上限高于市场时，只能按市场价出租，合规成本却一分不少。实际可收的租金，永远是法定上限和市场租金中的较低者。多数人默认这张表只会往上，但 Bisnow 报道的那个 Sawtelle 项目，2023 年签契约时的租金上限比 2025 年的新表还高。表的走向取决于 HUD 和州住房部每年公布的中位收入，2026 年洛杉矶县的 AMI 为 10.81 万美元，明年是多少，没有人能保证。按模型，表下调 3%，收益率掉 30 个基点。

        运营合规是固定开支。收入审核、年度认证、监管报告，这些不随租金涨，也不随空置降。市场化开发商第一次做 ED1，常常低估这一块，Sawtelle 的开发商把这列为出售的原因之一。

        政策会改，而且改得很快。ED1 在三年里出了三个修订版，历史保护区、租客占用地块、单户住宅区先后被排除；密度奖励的豁免项被限制到五项加一个。2025 年 CHIP 生效，SB 79 签署，两者都在分流 ED1 的项目。永久条例把游戏规则固定了下来，但固定的是规则，不是市场对规则的兴趣。

        利率和建安决定批文能不能变成开工。这是批文缺口的主因，前面已经讲过。按模型，建安涨一成，收益率掉 50 个基点；工期每多拖半年，建设期融资与持有成本多三十万美元上下。

        Measure ULA（洛杉矶高价房地产转让税）。2022 年底通过，门槛每年随通胀调整，2026 年 7 月 1 日起超过 540 万美元的交易征 4%，1,090 万美元及以上征 5.5%。有业内人士认为它压缩了包括 ED1 在内的可负担项目的利润空间，预计其中相当一部分不会建成。这是业内的判断，没有数据支撑，但退出那一天的税费确实要提前算进去。

        退出流动性。买家池窄，周期长，估值按受限租金定。模式②讲过的 2.5 到 4 年，是洛杉矶小型新建项目的参考周期，不是 ED1 项目的统计样本；ED1 缩短的只是规划环节，完整周期仍取决于图审、融资、建设和出租。
  - discriminant: sectionHeading
    value:
      text: 对跨境资本意味着什么
  - discriminant: prose
    value:
      md: |-
        对关注美国市场的中国资本来说，ED1 项目是一类很特别的资产：持有型、契约锁租、政策依赖。持有型，意味着它的价值在于现金流，不在于拆分出售；契约锁租，意味着收入的上限被锁死，稳定性换掉了弹性；政策依赖，意味着它的可行性建立在一套三年前才出现、三年里改了三次的规则上。

        此类资产的进入条件，在我看来是这样的。合作方要有可负担住房的运营和合规经验，而不只是开发经验；资金路径要在拿批文之前就锁定，建设贷、所有权结构、豁免申请一起谈；选址时要同时测算法定租金上限和当地市场租金，按两者较低者承保；上限高于市场的街区，项目拿不到额外租金，却要承担可负担住房的合规成本。

        它不适合的情形同样清楚：指望市场租金上涨带来估值提升的；需要在三到五年内拆分退出的；对政策变动容忍度低的。

        这些是这类资产的结构特征，不是对任何具体项目的评价。具体事项请咨询持牌专业人士。
  - discriminant: sectionHeading
    value:
      text: 下一条路径
  - discriminant: prose
    value:
      md: |-
        《美国房地产开发模式》写到第三篇，一条线已经清楚了。[第一篇](https://sinoamericanrec.org/zh/research/us-development-model-01-adu)的 ADU，靠州法把独栋后院变成可出租单元；第二篇的 co-living，靠 guest room 规则把出租颗粒度从住宅单元细分到房间；第三篇的 ED1，靠 100% 可负担换掉环评和听证。部分开发商在这三条制度路径之间切换，每一次都是用某种权利换某种速度。而这一切发生的背景，是[《大重置》](https://sinoamericanrec.org/zh/research/us-housing-great-reset-2026)里写过的那个市场：房价横盘、利率高企、新开工收缩，周期给不了的利润，开发商只能到结构里找。

        下一条路径已经出现。2025 年生效的 CHIP 把密度奖励和快批机制铺到了全市的交通走廊和商业走廊，同年签署的 SB 79 在州法层面做了类似的事，做过 ED1 的开发商正在往那边看。那是第四篇的内容。

        《SAREC ED1 项目资格自查清单》按条例的资格条款与性能标准逐项整理，可发邮件至 info@sinoamericanrec.org 预约领取，邮件注明「ED1」。
  - discriminant: sectionHeading
    value:
