    value:
      md: 作者及其关联方参与洛杉矶 ED1 项目的开发与投资。本文为开发模式研究，案例经匿名化处理，财务数字为 SAREC
        情景模型测算，不构成投资建议，也不构成任何形式的出资邀约。
  - discriminant: sectionHeading
    value:
      text: 从"没有厨房"到"100% 可负担"
  - discriminant: prose
    value:
      md: |-
        先给结论。ED1 是一场交换：开发商接受通常长达 99 年的可负担契约，交出租金定价权，也交出拆分产权的空间，换回规划审批环节的时间、更高的密度和一部分税费减免。这项交换足够吸引人，洛杉矶三年多申报了四万多套就是证明。但 2026 年的数据讲的是另一件事：拿到批文的三万多套里，拿到施工许可的不到四分之一。快批解决的是"批不批"，解决不了"建不建"，而后者才是开发商的生死线。

        [《美国房地产开发模式②》](https://sinoamericanrec.org/zh/research/us-development-model-02-coliving)讲到最后，留了一句话：co-living 靠 guest room 规则在土地配额上打开的缝隙，不是洛杉矶唯一的缝隙；同一批做市场化 co-living 的开发商，开始评估或转向另一条路，包括我们。这一篇把那条路拆开。

        为什么转？说白了是时间。一个需要裁量审批的市场化多户项目，在洛杉矶走完规划审批，按我们这几年的经验，九到十二个月是常态，六层以上还要更久；往往要过环评，要开听证，要去社区会议上被人指着鼻子问停车。

        2022 年底 ED1 出来，把这一段变成了没有环评、没有听证的非裁量审批。

        那时候我们以为买到的是速度。三年之后回头看，买到的东西是真的，只是账要重算。
  - discriminant: sectionHeading
    value:
      text: ED1 是什么
  - discriminant: prose
    value:
      md: |-
        2022 年 12 月 16 日，Bass 上任第一周签了第 1 号行政令（Executive Directive 1，下称 ED1），要求各部门对 100% 可负担住房项目在完整申请后 60 天内完成审批，并加快建筑许可、公用设施接入和入住许可的清关，相关清关限 5 个工作日。两个数字各管一段：60 天说的是规划与行政审批，5 天说的是特定清关环节，不是整套图审五天办完。它一开始只是市长的行政命令；2025 年 12 月 9 日市议会全票通过《可负担住房快批条例》（Affordable Housing Streamlining Ordinance，业内简称 AHSO，第 188788 号条例），12 月 19 日公告生效，把主要机制写进市法典，也顺手改了几条规则。本文沿用市场上通行的"ED1"叫法，但 2026 年起新申报项目的资格、契约期限、激励数量和审批程序，以现行条例和过渡规则为准。这也是本文现在写的原因：一项临时政策刚变成法律，2026 年是它作为法律的第一年。

        资格条件，按条例和市规划局的说明：五套以上；100% 可负担，也就是全部单元不高于 80% AMI（区域中位收入），或者最多 20% 的单元面向不高于 120% AMI 的中等收入家庭、其余面向不高于 80% AMI 的低收入家庭，租金按《加州健康与安全法》第 50052.5 或 50053 条的标准计算；不需要修改总体规划、分区或高度区，密度奖励和 TOC 之外也不需要其他豁免；分割申请本身不享受快批；不在海岸区，不在危废场地。2024 年 7 月的第三次修订又加了两条：历史保护叠加区内不能用，过去五年内住过 12 户以上租客的地块不能用。单户住宅区则在 2023 年年中的首次修订中就被排除，永久条例沿用了这一条。契约期限是永久条例改动最大的一处：按市法典第 16.61 条，出租型受限单元的可负担契约通常至少 99 年，从入住许可签发起算；特定公共补贴协议、服务人群或其他法定例外的项目可能适用不同期限（条例草案曾以税收抵免项目的 55 年为例），最终以录入的契约及适用的更长期限为准。行政令时期的实施指南按 55 年设定，市面上"55 年"的说法多来自那个阶段。永久条例生效前已提交并取得既得权的项目，可能继续适用当时的实施指南或过渡规则；2026 年以后新申报的项目以现行条例为准。

        换回来的东西，同样按公开文件：规划局环节 60 天审批目标（原始 ED1 及其实施体系设定，不含预申请审查、图审、部门清关、契约备案和施工许可）；免 CEQA 环评；免听证、免社区会议；住宅区项目可申请不超过 100% 的总容积率增幅，或提高至 3.5:1，两者取较高者，最终面积仍受基础分区、客观标准和批准结果约束；符合 AB 2097 或其他适用条件时，停车要求可以减少或免除。

        有一个词要先说清楚。ministerial approval，本文译作"非裁量审批"：只要项目符合客观标准，主管部门原则上必须批，不能根据听证意见或主观判断说不。它的对面是裁量审批，规划委员会和市议会可以根据听证和环评结果决定批或不批。非裁量审批的项目通常也不需要做项目层面的 CEQA（加州环境质量法）审查，这就是"免环评"的来历。ED1 的全部价值，说到底就是把项目从裁量审批搬到了非裁量审批。
