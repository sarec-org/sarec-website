  - discriminant: prose
    value:
      md: |-
        四万多套申报、三万多套批文，最后拿到施工许可的八千套。准确地说：截至 2026 年 5 月，洛杉矶 ED1 规划获批约 3.4 万套，取得建筑许可的 8,058 套，占 23%，这是市长办公室的数据，Bisnow 2026 年 6 月 14 日报道。23% 是用不同截止日的数据算出的横截面比例，不是 ED1 项目最终的许可转化率，近期获批的项目有一部分还在图审、契约备案和融资阶段。那么，中间那两万六千套去了哪里？

        它们没有全部消失：一部分仍在图审、清关和契约备案，一部分卡在融资和成本，一部分被挂牌转让或暂时搁置。卡住的原因，业内说得最多的是利率、建安成本和选址。给 ED1 项目放建设贷的 Century Housing 说，能开工的是有可负担住房经验、资金路径清楚的团队；停下来的，是遇到融资缺口、成本上涨，或者团队跟不上快批节奏的。还有一类更具体：项目选在可负担租金并不比市场租金便宜的区域。Bisnow 查了南洛杉矶和北好莱坞几个挂牌出售的项目所在街区，80% 到 120% AMI 的租金上限明显高于网上挂牌的市场化 studio 和一居室。租金上限不低于市场的项目，契约没带来租金端的支撑，合规成本却一分不少，融资优势明显减弱。

        于是出现了一个 2026 年特有的现象：一批取得规划批文、图审走到后期或达到 RTI（Ready to Issue，许可待签发）状态的 ED1 项目，在开工前挂牌出售。Robertson 大道一宗 150 套，Echo Park 一宗 95 套，挂牌资料都以"许可待签发"作为卖点，卖的是批文，不是楼。Bisnow 在南洛杉矶和北好莱坞随手又找到了六个。

        有人会说，管道里的项目多数是 2024、2025 年才批的，开工率低是因为时间还没到。Crosstown 今年 2 月专门算了 2023 年那一批：ED1 第一年获批的单元，两年多过去，拿到许可的只有 26%。单靠"项目还新"，解释不了全部缺口。

        批文数和施工许可数之间的这段落差，我称之为「批文缺口」。它是衡量任何一项快批政策真实产出的那个数字。
