  - discriminant: prose
    value:
      md: 三样换三样，看上去对等，其实不对等。密度和税费在别的路径也能拿到：密度奖励、TOC、2025 年生效的
        CHIP（全市住房激励计划），都给密度；福利性地税豁免不是 ED1
        自带的，要项目用途、所有权与融资结构、监管契约、非营利方实质管理和主管机关核定一起成立；联动费的豁免跟着可负担比例走，也不是 ED1
        独有。ED1 真正值钱的那一样，是用客观标准替代听证和裁量、免掉项目层面的环评程序。州法里的 SB 35
        等工具也给非裁量审批，但在洛杉矶，100% 可负担项目走得最多的是这条。
  - discriminant: pullQuote
    value:
      text: ED1 给开发商的最大补贴不是面积，是时间。
  - discriminant: prose
    value:
      md: 但这句话只对了一半。补贴的是规划局那一段的时间。后面还有一段，ED1 管不着。
  - discriminant: sectionHeading
    value:
      text: ED1 的三个时钟
  - discriminant: prose
    value:
      md: |-
        我把 ED1 项目的时间拆成三个时钟，叫它「ED1 三个时钟」，因为过去一年里，我看到的绝大多数争论，都是拿一个时钟的读数去评价另一个时钟。

        规划局的时钟。ED1 实施体系下的 60 天目标，起点是申请被认定为"完整"，终点是规划局发出批准函。它不包括之前的预申请审查（PAR，用来确认项目有没有资格进 ED1），也不包括之后的任何环节。市政府对外说的"审批从九个月压到几周"，说的就是这一段。这个数字是真的，但它是规划局的绩效指标，不是开发商的工期表。

        开发商的时钟。拿到规划局批准函，只是整条链的第一环。后面是建筑安全局的图审，通常一到三轮修改；水电局的接入审查；消防、工程局、卫生局的清关；住房局的可负担契约备案，契约备案完成之前建筑许可不会签发；然后才是施工许可。每一环都有自己的队列，互相之间不共用 ED1 的时钟。Bisnow 今年 6 月报道的一个 44 套 ED1 项目，从前期启动到开工用了 12 个月，报道说这在洛杉矶已经算快的。

        这个时钟还有一个反向的读数。按市建筑法规，图审文件提交后 18 个月内不领取施工许可就作废，延期要另行申请。也就是说，一个项目拿到规划局批准函之后如果在融资上停了下来，它不只是在等，它手里的图审在过期。这是后面讲到的那批"卖批文"的项目，为什么宁可打折出售也不再等的原因之一。

        我们参与的一个 ED1 项目，已经走完了施工许可和建设贷款，各段的实际时长等账目整理完再更新进来。

        市场的时钟。这是第三个，也是 2026 年最值得看的一个。
