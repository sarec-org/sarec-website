  - discriminant: prose
    value:
      md: 本文财务数字为 SAREC ED1
        情景模型测算，参数取整，不对应任何具体项目，非实际经营账目，文中的融资测算是简化的敏感性分析，不构成银行承销、贷款报价或授信承诺；ED1
        管道数据来自市长办公室、市规划局及 Bisnow、Crosstown 等公开报道，申报与获批数截至 2026 年 4 月、施工许可数截至
        2026 年 5 月、管道总量截至 2026 年 7 月；法规、租金表、费率与税率门槛核验至 2026 年 10 月 15
        日，各项资格、豁免与费率以主管机关现行文件为准；文中提及的具体项目均来自公开报道，涉及上诉与诉讼的表述以法院最终文件为准；模式②提到的 66
        单元对照项目，即本文所述作者参与的 ED1 项目，因账目尚未定稿，本篇不披露项目级数字，整理完成后更新。
faq:
  - question: 洛杉矶 ED1 是什么？
    answer: ED1 是洛杉矶市长 Bass 于 2022 年 12 月 16 日签发的第 1 号行政令，对符合条件的完整申请设定 60
      天规划审批目标，实行非裁量审批、免 CEQA 环评、免听证。2025 年 12 月市议会将其写入市法典，成为《可负担住房快批条例》。
  - question: ED1 审批真的只要 60 天吗？
    answer: 60
      天只管规划局这一个环节，从申请被认定完整到发出批准函。之前的预审、之后的图审、水电消防清关、契约备案和施工许可都不在其中。一个被报道为进展较快的公开案例，前期也用了约
      12 个月；实际时长因项目而异。
  - question: 为什么很多 ED1 项目拿到批文却开不了工？
    answer: 截至 2026 年 5 月，获批约 3.4 万套中取得建筑许可的 8,058 套，占
      23%。主要原因是利率、建安成本和选址：可负担租金上限不低于所在街区市场租金的项目，融资优势明显减弱。数据来自市长办公室，经 Bisnow 报道。
  - question: ED1 项目的租金怎么定？
    answer: 按洛杉矶住房局每年发布的收入与租金表，全部面向不高于 80% AMI 的低收入家庭，或最多 20% 的单元面向不高于 120% AMI
      的中等收入家庭，并录入通常至少 99
      年的可负担契约（特定补贴协议或法定例外可能适用不同期限，以录入契约为准）。合同租金不能超过表上限，实际可收租金取表上限与市场租金的较低者；表可上可下。
  - question: 80% AMI 在洛杉矶是多少钱？
    answer: 2026 年洛杉矶县四口之家的 AMI 为 108,100 美元；官方表格中的单人低收入限额为 93,300 美元，这个数字经过 HUD
      和州住房部调整，不等于 108,100 简单乘以 80%。不同项目适用的收入与租金表可能不同，最终由洛杉矶住房局指定；本文模型取一居 1,950
      美元，是用于展示量级的模型假设。
  - question: ED1 项目能不能拆成 condo 卖？
    answer: 本文研究的出租型模型不以逐套出售为退出路径：分割申请本身不享受快批，须另行走分割审批并满足可负担出售价格与契约要求；契约通常至少 99
      年，跟地走。对整体持有的出租型项目而言，严格意义上的资产退出是整栋出售；再融资属于资本回收，产权仍在原持有人手里。
  - question: 99 年契约到期后怎么办？
    answer: 契约期满后房产在理论上可回到市场化用途，但取决于届时的法律和所有权安排。99 年远超任何投资人的持有期，实务上应把它当作永久受限来评估。
  - question: ED1 项目的地税能免吗？
    answer: 有条件。加州福利豁免要求房产由符合条件的非营利组织持有，或由非营利担任管理普通合伙人、且有政府融资或低收入住房税收抵免支持的有限合伙持有，并受监管协议或契约限制，还要取得州税务委员会的清关证明；由市场化开发商全资持有、纯私人融资的项目一般不符合条件。以州税务委员会和县估税官的核定为准。
  - question: ED1 和 SB 35、CHIP 有什么区别？
    answer: SB 35（2023 年由 SB 423 延长并扩展）是州法层面的快批机制，适用范围含混合收入项目；CHIP 是洛杉矶 2025
      年生效的全市住房激励计划，主要沿交通走廊和商业走廊给密度和快批；ED1 只针对 100%
      可负担项目，给的是免项目层面环评的非裁量审批。三者可能叠加或替代，需逐项目核对。
  - question: ED1 项目怎么估值？
    answer: 按受限租金的净营业收入除以资本化率，不按周边市场化公寓的可比价；买家主要是可负担住房的专业持有者、非营利组织和公共机构。地税是否豁免直接影响净营业收入，同一栋楼两种口径的估值可以差两成上下。
  - question: ED1 会不会被取消？
    answer: 2025 年 12 月已写入市法典，取消需要市议会立法。但它在三年内已修订三次，此前几次修订总体是收紧适用范围、增加项目条件；SB
      79、CHIP 等新工具也在分流项目。规则固定不等于市场兴趣固定。
  - question: 中国投资人能不能参与 ED1 项目？
    answer: 从结构上看，可以作为有限合伙人参与持有型项目，但需要具备可负担住房运营经验的合作方、提前锁定的资金路径和合规的所有权结构。本文不涉及任何具体项目或募集，具体事项请咨询持牌律师与税务顾问。
