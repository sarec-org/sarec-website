    value:
      md: 本文财务数字除特别注明外,均为项目 Pro Forma 与测算模型口径,非实际经营账目;组合台账数据截至 2025 年 6 月 13 日;法规条文核验至
        2026 年 8 月;"仅计利息情景"一层为 SAREC 测算,未含建设期地税、保险与贷款费用,非项目融资记录;SAREC
        建安与管理费经验口径为截至 2026 年中;再融资金额为贷款额,非股东净回款;文中对照项目(66 单元常规公寓)数据同为 Pro Forma
        口径。案例项目实际运营账目整理完成后,本篇将更新。
faq:
  - question: 什么是 co-living 共居开发?
    answer: 收购低密度住宅物业,开发为按"房间"而非"住宅单元"出租的高密度共居资产。租户独享卧室和卫生间,共享厨房等公共区域;项目整体持有、长期运营,不可拆分销售。
  - question: Co-living 和普通公寓有什么区别?
    answer: 核心区别在出租颗粒度和产权结构。普通公寓按完整 dwelling unit 出租;在分区、建筑条件和地方审批允许,并完成 final
      map、parcel map 或 condominium plan 等程序后,才可能形成可独立出售的产权。本文研究的 co-living
      按房间出租、以 guest room 为主要出租结构,且没有创建这些独立产权空间,只能整体持有。
  - question: 为什么 co-living 的房间不设厨房?
    answer: 因为洛杉矶市法规以厨房为主要分界之一区分"住宅单元"和"客房"(另有 light housekeeping room
      等例外类别)。一般情况下,不设独立厨房的居住空间更可能按 guest room 而非 dwelling unit
      设计和核准,具体法律用途以项目批准图纸和许可文件为准。土地配额上,R3 区为每 dwelling unit 800 平方英尺对每 guest
      room 500 平方英尺,R4 区为 400 对 200。这是洛杉矶 co-living
      品类的通行设计,由法规、土地配额与租金测算共同决定,并非个别项目的特殊安排。
  - question: 30 个房间为什么不能分开卖?
    answer: 现有产权记录中,这 30 个房间从未通过 final map、parcel map 或 condominium plan
      被创建为可独立转让的权益,整栋楼是一宗产权。若要拆分,须重新设计并经 Subdivision Map Act 下的地方审批;现有 30
      个房间不能原样转化为 30 个独立产权,重新报批后的单元数量与经济可行性,须按项目实际分区和批准条件重新核算。
  - question: Co-living 每平方英尺租金为什么更高?
    answer: 单人租客对总租金敏感,对单价无感。房间总价低于一居室,物业单位面积收入反而更高。A 项目模型每平方英尺年收入 63.2 美元(含停车,剔除后约
      61.3),同城 66 单元常规公寓模型为 45.1 美元,高约 36%–40%。此为两案例模型对比,非市场统计。
  - question: 在洛杉矶开发一栋 co-living 要多少钱?
    answer: 按 SAREC 截至 2026 年中的洛杉矶项目经验,建安成本与层数相关:4 层约 210–220 美元/尺,6 层 240–260,8 层
      280 上下,近两年受关税与人工影响持续上浮。A 项目实例:基础施工按 285 美元/尺入模,全部开发成本 380 美元/尺,含土地 476
      美元/尺;再按 SAREC 情景假设计入约 4 年完整开发周期的利息,约在 575 美元/尺量级(未含建设期税费、保险等
      carry)。仅引用承包商报价会严重低估资本需求。
  - question: 洛杉矶开发项目真实周期多长?
    answer: 要分两个口径。审批周期:按 SAREC 在洛杉矶项目的实际经验,常规项目 City 审批通常约 9 个月到 1 年,6
      层及以上因结构、消防、机电和跨部门协调更复杂,通常更长。完整开发周期(买地到出租,含设计、审批、融资、施工、招租):组合台账显示,独立屋改造约
      1–2 年;已完工 ground-up 约 2.5–4.3 年,另有在建项目当时台账计划约 4.4 年;一宗 2022 年 8 月买入的项目,截至
      2025 年 6 月仍未动工。按情景假设,每月延迟仅利息一项即约 2 万美元,另有税费与保险。
  - question: Co-living 的运营费用有什么特点?
    answer: 共居额外承担保洁、耗材和全部水电,换租频率也高于常规公寓,是重运营资产。A 项目模型费用率 36.2%,高于组合台账的 30%
      统一假设——注意,这是单项目模型与组合台账假设之间的差异,不是 co-living 与普通公寓的全市场费用率比较。模型管理费按 10%
      计提(SAREC 运营经验中市场常见 6%–8%,模型属从紧假设),5% 空置率为常规公寓参数,须以真实账本验证。
  - question: 8.5% 的收益率是怎么算出来的?
    answer: 模型年债前现金流 412,413 美元除以含土地总成本 4,874,487 美元,约 8.5%,为 Pro Forma
      口径。未含贷款利息、所得税与建设期资金成本;仅计入利息情景后约回落至 7% 附近。低情景使用约 466.6
      万美元的另一套总成本基础,按其自身模型口径计算为 5.0%——它不是只降租金、其他条件不变的单变量测试。
  - question: 为什么不能只看 IRR?
    answer: A 项目基准情景 IRR 26.6%,但其主要贡献来自第 4 年按 5.5% 资本化率整体出售的终值假设。IRR
      奖励早退出和高终值,适合快周转;衡量长期持有应看 Yield on Cost 与 NOI 增长,再拆开终值假设参考 IRR。
  - question: 不能拆卖,本金怎么拿回来?
    answer: 主要靠整体再融资释放部分资本。项目稳定出租后,银行按 NOI
      和估值发放长期贷款,但再融资贷款总额不等于股东净回款:新贷款要先偿还收购贷、建设贷及相关费用,剩余净额才可能返还资本。组合台账中的 100
      万、260 万、473.5 万美元均为贷款总额,只能说明开发完成后资产的融资基础显著提高,不能理解为股东拿回了同等金额的现金。
  - question: 什么样的投资人适合 co-living?
    answer: 长期资本、能接受低流动性、有稳定融资渠道、真正愿意做运营的投资人。资金三五年必须退出的、不愿管理租户的、只看房价不看 NOI 的,不适合。
  - question: Co-living 最大的风险是什么?
    answer: 三类:运营风险(换租率与管理强度可能高于模型假设);完整开发周期与资金成本风险(台账中的 2.5–4.4
      年是买地到出租的完整周期,含设计、审批、融资、施工、验收、招租,期间利息持续累积);退出流动性风险(只能整体出售,买家池窄)。
  - question: Co-living 在美国合法吗?
    answer: 在符合适用分区、建筑、消防、居住密度及项目审批要求的前提下,洛杉矶可以利用 guest room
      等既有法规类别开发共居型出租产品;不同城市、不同项目的批准路径可能完全不同,须以具体批文和专业意见为准。本文仅描述洛杉矶市框架,不构成法律意见。
  - question: Co-living 项目退出时谁来买?
    answer: 整体买家:高净值投资人、家族办公室、专业出租资产投资机构、基金。不是普通家庭买家,因此退出周期和定价都更接近机构资产交易。
  - question: 台账估值 6,808 万可信吗?
    answer: 要打折看。其中仅两宗为贷款机构 appraisal,其余按统一费用假设推算 NOI 再按资本化率折算;两宗未完工项目对应约 35%
      的估值,另有一宗采用二期完成后的估值口径,而二期在台账日期时尚未完成。台账适合观察规模与资本结构,6,808.5
      万不能理解为已全部实现、可立即成交的市场价值。
