  - discriminant: assetBreak
    value:
      kind: image
      src: /images/research/uploads/img-model02-double-density.webp
      alt: SAREC 双密度模型示意:建筑面积增加 3.5 倍,收租单元增加 6 倍,颗粒度贡献 1.7 倍
  - discriminant: prose
    value:
      md: |-
        注意中间那行。面积只增加了 3.5 倍,收租单元却增加了 6 倍。多出来的那 1.7 倍,不是盖出来的,是切出来的——把"整栋出租给一家人"切成"30 个房间分别出租给 30 个人"。

        这就是我们说的双密度:决定一块土地收入承载力的,不只是能盖多少面积,还有面积被切成什么颗粒出租。

        颗粒度的价值可以直接算出来。A 项目稳定运营模型年收入 646,800 美元(含 16 个车位的停车收入),除以 10,241 平方英尺,每平方英尺年收入 63.2 美元;剔除停车后约 61.3 美元。我们研究的另一个洛杉矶项目——66 个单元的常规公寓,带厨房,下一期模式③会完整拆解——同口径算出来是每平方英尺 45.1 美元。

        两套洛杉矶项目 Pro Forma 的对比:按房间出租的物业,每平方英尺收入比按单元出租高约四成,剔除停车后约 36%。这是两个项目模型之间的差异,不是全市场统计,但方向清楚。

        道理不复杂。租房市场上,单人租客对"总租金"敏感,对"每平方英尺单价"无感。一个月薪五千的年轻人租不起 2,800 美元的一居室,但租得起 1,700 美元的带卫生间单间。他付的总价更低,你收的单价更高,中间的差额,就是把面积切细的钱。

        而洛杉矶恰好有一个庞大的、别的产品接不住的单人租客群体:刚工作的年轻人、研究生、换城市的新移民、短期派驻的专业人士。他们要的是位置、家具齐全、水电全包、随时能搬进来——恰好是 co-living 收进租金里的那几样服务。A 项目 30 个房间定价 1,450 到 2,150 美元,正卡在"合租一间主卧"和"独租一居室"之间的空档上。这个空档在洛杉矶这样的大城市一直存在,但很少有产品专门为它设计。在[《美国房地产大重置》](https://sinoamericanrec.org/zh/research/us-housing-great-reset-2026)描述的高利率、低可负担性环境里,买不起房、也租不起整套的人群还在扩大,这个缺口更可能继续变宽,而不是收窄。

        把租客那一侧也说清楚:他付 1,700 美元,买到的是一间私人房间加共享厨房、餐厅这些公共区域的使用权——341 平方英尺是每个房间分摊的整栋建筑面积,含公摊,不是他独享的面积;隔壁 2,800 美元的一居室,700 尺全归他一个人。租客的总支出少了四成,物业每平方英尺建筑面积产出的收入却更高。谁也没占谁便宜——这层需求在市场上原本就存在,只是很少有人专门去切它。

        当然,切细是有代价的。代价分两处:一处在运营上,后面讲费用表时你会看到;另一处在法律上——正是下一节的主题。
  - discriminant: sectionHeading
    value:
      text: 厨房分界线:一墙之隔,两种法律身份
  - discriminant: prose
    value:
      md: |-
        现在回答开头的问题:为什么房间里只有卫生间,没有厨房?

        因为在洛杉矶的法规体系里,**厨房是"房间"和"住宅单元"的分界线**。

        在 LAMC 12.03 的定义体系中,厨房通常是 guest room 与 dwelling unit 之间最重要的分类因素之一:guest room 原则上不带厨房;efficiency dwelling unit 则可以把厨房、起居、睡眠放在同一间。但法规同时设有 light housekeeping room 等例外类别——带烹饪功能、在土地配额和停车计算上仍按 guest room 计(须符合建筑规范对应条款)。所以厨房配置决定的是主要分类方向;项目最终属于哪一种法律用途,以批准图纸和许可文件为准。

        一般情况下,独立厨房会把居住空间推向 dwelling unit;不设厨房,则更可能按 guest room 设计和核准。

        这条线值多少钱?看土地配额。R3 多户住宅区,每个 dwelling unit 最低占 800 平方英尺地块面积,每个 guest room 500 平方英尺,差 1.6 倍;到了 R4,是 400 对 200,整整一倍。从 R3 到 R4,guest room 相对 dwelling unit 的土地配额优势,由 1.6 倍扩大到 2 倍。

        这里要把口径说死:R3 和 R4 的数字,只用于说明洛杉矶法规中 guest room 与 dwelling unit 可能采用不同的土地配额,并不是 A 项目的审批公式。A 项目最终形成 30 个运营房间,取决于该地块的实际分区、密度激励、设计方案和项目级批准文件;本文没有逐页披露完整批文,因此不按一般分区规则反推它的具体核准路径。读任何开发项目都一样:最终要回到它自己的批文,而不是停在法条的一般规定上。

        把这条线和上一节的双密度放在一起,co-living 的机制就完整了:
  - discriminant: pullQuote
    value:
      text: 不设独立厨房 → 通常更可能按 guest room 而非 dwelling unit 设计和核准 →
        在适用分区与项目审批允许的条件下,形成更细的出租颗粒 → 单位建筑面积收入可能提高。
  - discriminant: prose
    value:
      md: |-
        一个厨房,在基础土地配额上就差出 1.6 到 2 倍;而前一节的案例对比又显示,按房间出租的单位面积收入高出三四成。两层证据来自不同层面——一层是法规配额,一层是两个项目的模型对比——但说的是同一件事:颗粒度就是收入密度。这是 co-living 全部生意的支点。

        要说明的是,这不是哪一家开发商的独门发明。洛杉矶做 co-living 的团队,产品大都是这么设计的,至少我们见过的项目里没有例外——把 guest room 规则、土地配额和租金测算放进同一张表,算出来的最优解就是"带卫生间、不带厨房"。产品设计和财务测算共同推出的商业结果,谈不上谁的巧思,但正因为它是品类的通行逻辑而非个案,才值得当作一种"模式"来研究。

        但天下没有白拿的配额。guest room 身份在给你密度的同时,也锁死了另一扇门——产权。这个代价放到后面讲,先把账算完。
  - discriminant: sectionHeading
    value:
      text: 全成本解剖:285、380、476,以及表外的第四层
  - discriminant: prose
    value:
      md: >-
        先纠正一个流行说法:洛杉矶的建安成本没有"一个数",它和结构类型、层数直接相关。以 co-living 为例,按 SAREC 截至 2026
        年中在洛杉矶项目询价与施工中的经验:4 层大致 210–220 美元一尺,6 层 240–260,8 层 280
        上下——关税涨、人工涨,这些区间还在往上走。但不管落在哪一档,建安都只是四层成本口径的第一层。A 项目的成本表把这件事拆得很清楚。


        第一层,基础施工。10,241 平方英尺乘以 285 美元,Ground-up Construction 为 2,918,685
        美元。承包商报价说的就是这个数。


        第二层,全部开发成本。基础施工之外,项目管理与监理 10%(291,869 美元)、硬成本预备金 10%(291,869 美元),硬成本小计
        3,502,422 美元。再加软成本 326,015 美元——图审、结构、土木、地质、测量、permit、学区费、水电表、建筑师费
        5.5%、保险,一项跑不掉——以及家具 61,050 美元。开发成本合计 3,889,487 美元,折每尺约 380 美元。


        第三层,含土地全口径。加上 985,000 美元买地款,Total Cost Basis 为 4,874,487 美元,每尺约 476 美元。
