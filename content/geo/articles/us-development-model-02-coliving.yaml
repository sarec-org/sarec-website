blocks:
  - discriminant: assetBreak
    value:
      kind: image
      src: /images/research/uploads/模式02头图-替换文件名.webp
      alt: 洛杉矶 West Adams 一栋由独立屋地块新建而成的 30 房间 co-living 共居物业
  - discriminant: prose
    value:
      md: |-
        本文案例是我们自己投资开发的项目,数字来自项目账目与测算模型,不是网上抄来的行业均值。也正因如此,这篇文章不构成任何投资建议或出资邀约——账摊开给你看,是为了讲清楚一种开发模式,判断请你自己下。

        2021 年 1 月,我们在洛杉矶 West Adams 用 98.5 万美元买下一栋房子。地块约 7,800 平方英尺,上面是一栋 2,935 平方英尺的老独立屋,5 间卧室。到 2025 年二季度,这块地上站着的是一栋 10,241 平方英尺的新建筑,里面 30 个房间,每个房间带独立卫生间,按稳定运营的模型口径,一个月租金收入 5 万多美元。

        30 个房间,30 把钥匙,30 个房号。

        但从头到尾,它只有一张地契。County 记录里,它是一宗房产,不是 30 宗。拆开卖?不行,一间都卖不了。

        第一次听到这个安排的人几乎都会问:为什么不拆?30 间分开卖,不是回款更快吗?答案藏在一个多数人想不到的地方——这些房间没有厨房。

        不是忘了装,是故意不装。

        这篇文章讲的就是这门生意:Co-living 共居开发。它为什么按房间收租,为什么单位建筑面积收入可能高于普通公寓,为什么厨房配置影响用途分类和密度、而产权记录最终决定它能不能拆开卖,以及当项目从一栋楼变成一个组合之后,账本上哪些数字是真的,哪些要打折看。
  - discriminant: sectionHeading
    value:
      text: 什么是 Co-living 共居开发
  - discriminant: prose
    value:
      md: |-
        中美房地产商会把这类项目定义为:**收购低密度住宅物业,在规划与审批允许的范围内,将其开发为以"房间"而非"住宅单元"为出租颗粒的高密度共居资产;租户独享卧室与卫生间,共享厨房等公共功能;项目以整体持有、长期运营和再融资作为价值实现路径,不可拆分销售。**

        先把它和几样容易混淆的东西分开。它不是模式①讲的 ADU 增密——那个产品的颗粒度仍然是"户",每个经营模块有完整的居住功能;co-living 把颗粒度又往下切了一刀,切到房间。普通公寓就更不一样了,公寓每个 unit 带厨房,法律上是 dwelling unit,而 co-living 的房间没有厨房,法律上是另一个东西,后面细讲。至于市面上租下整栋再分租的二房东玩法,和这里说的完全是两回事:开发商持有产权,买地、设计、施工、运营全链条自己做,是重资产。

        还有一句要说在前面:co-living 是产品和运营概念,不是法典里一个统一的产权类别。市场上还有租赁运营型(二房东模式)等其他形态;本文只讨论洛杉矶这种版本:开发商自己买地、自己建、建成后自己持有运营,整栋以 guest room 为主要出租结构运营,始终是单一产权。

        这个定义里最要紧的一句是"不可拆分销售"。多数人把它当成缺陷,做这行的人把它当成模式的定义本身——这个分歧,是理解 co-living 的入口。
