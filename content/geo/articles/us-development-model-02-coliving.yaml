    value:
      md: >-
        一个口径说明:两种情景不仅收入和费用假设不同,总成本基础也不同——基准情景 487.4 万美元,低情景 466.6 万美元。8.5% 与
        5.0%(以及两个回收期)都是各自模型口径下的结果,不是只动租金、其他条件不变的单变量测试。


        看这张表的正确姿势:收入降 29%,费用只降 3%,现金流掉 44%,收益率从 8.5% 直落
        5.0%。费用是刚性的,收入是弹性的,这类资产顺风时放大收益,逆风时也放大疼痛。


        Dashboard 里还有一组更扎眼的数字:基准情景 IRR 26.6%,低情景 4.3%。这个 26.6%
        值得单独说一说,因为它是一面照妖镜。


        拆开模型看,26.6% 不是收租收出来的——它依赖第 4 年按 5.5% 资本化率把整栋楼卖掉的终值,那一笔进账 735
        万,占了模型里绝大部分回报。也就是说,一个用来论证"长期持有"的项目,它最漂亮的那个数字,来自第四年卖掉。


        这不是模型做错了,是语言用错了。IRR 是快周转开发商的语言,它天然奖励"早退出、高终值";长期持有者的语言是 Yield on Cost 和
        NOI——今天这栋楼扣完费用能剩多少现金,明年能不能更多。


        我们的立场一贯:看这类项目,先看 YoC,再看 NOI 的增长路径,最后才参考 IRR,而且要把终值假设扒开看。
  - discriminant: sectionHeading
    value:
      text: Door ≠ Dwelling Unit ≠ Deed:为什么一间都不能卖
  - discriminant: prose
    value:
      md: |-
        账算完了,回到产权问题。

        第一层:30 个 door 是运营概念。房号、租约、钥匙,这些是管理工具,不是法律身份。

        第二层:这 30 个房间不是 30 个 dwelling unit。它们没有厨房,在 LAMC 12.03 的定义体系里是 guest room——这是当初拿密度时主动选择的身份,现在它的另一面显形了。

        第三层:30 个房间背后,没有 30 个记录在案的独立产权空间。这里要说得准确:加州州法对 condominium 的定义是空间性的(Civil Code §4125,"共同产权加上对某一空间的独立权益"),州法层面并没有一条写着"客房不得成为 condo"。真正的锁在产权记录和产品结构上——一宗不动产要能逐间出售,必须先经 Subdivision Map Act 下的地方审批,把每个空间以 final map、parcel map 或 condominium plan 记录为可独立转让的权益。这栋楼的产权记录里没有这些东西:它从立项那天起,就是按一宗整体持有的出租物业来设计、报批和建造的,零售退出从来不在它的图纸上。

        Door 不等于 deed:房号是运营概念,deed 背后要有记录在案的独立产权空间——这类 co-living 从产品定义那天起,就没给自己留这条路。

        较真的读者会问:一点回头路都没有吗?严格说有——重新设计、重新报批,把房间改造成合规住宅单元,再申请 subdivision 把它们记录为可独立转让的权益。但届时一切要按项目实际分区、密度奖励、停车、消防和新的产权方案重新核算,现有 30 个 guest room 不可能原样转成 30 个可出售的住宅产权;最终能保留多少单元,以新的规划审批结果为准,本文不在批文之外自行推算。对现有项目,结论很清楚:在当前产权与批准结构下,只能整体持有或整体出售,不能逐间卖。

        [模式①](https://sinoamericanrec.org/zh/research/us-development-model-01-adu)里我们讲过"经营模块不等于法定住宅单元",那时候还是四五个模块对两个法定单元的温和版本。Co-living 把这件事推到了极限:30 个经营模块,一宗产权,中间没有任何过渡形态。

        所以这类资产严格意义上的退出只有一条:整栋卖给下一个买家。再融资能把一部分资本先抽回来,但产权还在自己手里——那是资金的退出,不是资产的退出;继续持有则干脆不是退出,是选择不退。而整栋出售的买家池,是高净值投资人、家族办公室、专业出租资产投资人和基金——不是普通家庭。资产越大,买家越专业,数量越少,这是必须提前想清楚的流动性代价。

        但换个角度看,不能拆卖也是一种纪律。能逐套卖的开发商,画图时想的是样板间拍照好不好看;只能整体持有的开发商,画图时想的是这个材料二十年里要换几次、这个设计每个月多花多少人工。产品哲学从第一天就不同。

        不能零售退出的项目,只能靠真实现金流活着——这也算一种被迫出来的纪律。
  - discriminant: sectionHeading
    value:
      text: 一个项目是运气,一个组合才是模式
  - discriminant: prose
    value:
      md: |-
        单个项目跑通可能是运气,同一条路走十遍才是模式。截至 2025 年 6 月,我们的组合台账列有 11 宗物业、244 个 door,分布在 Highland Park、Koreatown、West Adams、West LA 一带:累计买入价 1,341 万美元,台账估值 6,808.5 万,再融资贷款额 3,621.5 万,月毛租金 40.87 万。先说清楚:这些是台账列示口径,包含尚未完工项目的预测租金和估值,不能全部当成已建成、已出租、已实现的经营结果。

        这套组合最值得研究的是再融资循环。三个例子:

        Highland Park 那宗,87.5 万买入,估值 217.5 万,再融资贷款总额 100 万——高于当初的买入价。West Adams 一宗,140 万买入,估值 630 万,再融资 260 万。A 项目本身,98.5 万买入,台账估值 850 万,再融资 473.5 万。有一个口径必须说破:这些是贷款额,不是股东到手的现金。新贷款首先偿还收购贷、建设贷和交易费用,剩下的净额才是回笼资本,而台账没有记录净额。所以这三组数字只用来说明一件事:开发完成、出租稳定之后,同一宗资产在银行眼里的融资基础完全变了。

        模式是清楚的:买入、开发、稳定出租,再按新的 NOI 和估值办永久贷款;新贷款偿还原有收购贷、建设贷及费用之后,如有剩余净额,才释放部分资本投入下一宗——资产不卖,租金保留。这就是不能拆卖的 co-living 依然能滚动扩张的引擎。模式①把这叫"牺牲现金流换资本周转",在不出售资产的前提下,它是 co-living 组合最主要的资本周转方式。

        然后是几句实话。自家的账,更要把口径说满。

        先交代一处口径差异:组合台账把 A 项目记为 29 个 door、10,341 平方英尺、月租 50,600,与单项目文件的 30 间、10,241 尺、模型月收入 53,900 都有小出入。两套文件的用途不同,本文各按其表引用,不硬拼成一个整齐数字。

        再说最容易被误读的:估值减买入价不是利润。1,341 万和 6,808 万之间,隔着每个项目几百万的开发投入、四年上下的利息和台账上没有的税费。谁要拿这两个数直接相减讲故事,你转身就走。

        再说台账 NOI——它是统一假设,不是实际账本。你要是把组合表逐行按计算器过一遍,会发现一个规律——每一行的 NOI 都恰好等于毛租金的 70%,一行不差,这显然是按 30% 费用率做的统一测算,而真实世界的费用不可能十一宗物业整齐划一。A 项目逐项 Pro Forma 算出来的模型费用率是 36.2%,比台账假设高出 6 个多百分点;这个差距放在全组合 40 万月租的盘子上,一年就是 30 万美元以上的现金流差异,足够改变一笔再融资的可贷额度。所以我们内部的用法是:组合台账看规模、资本结构、跟银行谈额度;单项目逐项 P&L 看模型成不成立、费用有没有漏项;真要判断一栋楼实际赚不赚钱,最终只认稳定运营后的真实账本。三种资料各干各的活,谁也不冒充谁。

        还有一件事必须讲:244 个 door 里,没建成的不止三分之一。两宗未完工项目合计 80 个 door,占 33%,它们对应的月租 14.25 万、估值 2,394 万,属于台账测算而非已实现经营结果;另有一宗注明二期新增 15 个房间、其 825 万估值为二期完成后口径,而台账当时记录的是二期计划于 2025 年三季度动工。把这 15 间一并计入,尚未完成的部分接近 95 个 door,约占组合的 39%——近四成。

        最后,估值本身多数是模型推的。假设费用率算出 NOI,再除以假设的资本化率,得出估值——只有两行是贷款机构出具的 appraisal。模型套模型,数字自然好看。我们自己心里有数,也希望你有数。

        把丑话说在前面,剩下的才是干净的结论:即便只看已完工、已出租的部分,这条"买入低密度、开发成共居、再融资滚动"的路径,在洛杉矶被同一个团队连续走通了八年。这个事实本身,比任何单项目的漂亮数字都有分量。
  - discriminant: sectionHeading
    value:
      text: 结语:密度是拿来换的,不是拿来吹的
  - discriminant: prose
    value:
      md: "把整篇压成一句话:"
  - discriminant: pullQuote
    value:
      text: Co-living 以共享厨房替代每个房间的独立厨房,换来更高的收租密度和单位建筑面积收入;代价是更重的运营,和在现有产权结构下只能整体退出。
  - discriminant: prose
    value:
      md: |-
        这笔交换划不划算,不取决于密度本身,取决于三件事:你的资本是不是长钱,你的团队会不会运营,你对"不能零售退出"这件事是不是真的想明白了。三个问题都答得上来,这个模式对你成立;有一个含糊,就要小心——密度越高,套得越深。

        至于监管这一侧——co-living 靠 guest room 规则在土地配额上打开的缝隙,不是洛杉矶唯一的缝隙。2022 年底,洛杉矶针对符合条件的 100% 可负担住房项目推出了更快的审批机制,配套长期可负担性限制和一系列开发优惠。同一批原来做市场化 co-living 的开发商,开始评估或转向这条路径,包括我们。它的适用资格、租金限制、审批边界和真实项目周期,是《美国房地产开发模式③》要单独拆解的内容。

        文中 30 个房间的逐间租金、四层成本口径和压力测试,我们整理成了一份可以自己改数的《Co-living 30 房间租金与成本明细表》读者版。需要的读者,发邮件到 info@sinoamericanrec.org,注明"模式02"即可领取。
