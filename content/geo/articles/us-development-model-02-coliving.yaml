  - discriminant: prose
    value:
      md: |-
        第四层是成本表上没有的:钱的成本。这张表里没有一行利息,没有建设期的地税、保险 carry。而组合台账显示,A 项目 2021 年 1 月买入,2025 年二季度才开始出租——4 年零 3 个月。这一层只能做情景测算:假设完整开发周期内平均在贷 300 万、年化 8%,约 4.3 年的利息约 103 万美元。仅把这项利息情景加回,成本基础就从 487.4 万上升到约 590 万,折约 575 美元/平方英尺,8.5% 的收益率相应回落到 7% 附近。注意:这里仍未计入完整的建设期地税、保险、贷款费用等 carry,所以 590 万不能理解为最终实际总成本,它只用来说明时间和利息对成本基础的影响。真实的贷款结构、提款节奏、股东实际投入,只有项目账本能回答,本文不做该项声明。

        Pro Forma 的收益率和股东的收益率之间,隔着一个工期。

        所以下次有人跟你说"我这项目建安才 285 一尺",你要接着问四个问题:含不含管理和预备金?含不含软成本和家具?含不含地?含不含这几年压在里面的利息?四个问题问完,285 通常就变成 550 往上了。
  - discriminant: sectionHeading
    value:
      text: 时间账:审批通常 9–12 个月,完整周期按年算
  - discriminant: prose
    value:
      md: |-
        我做了 28 年房地产,给你把洛杉矶开发的时间算成两笔账。

        第一笔是审批。按我们在洛杉矶项目里的实际经验,常规项目的 City 审批阶段通常要 9 个月到 1 年;到了 6 层及以上,结构、消防、机电和跨部门协调明显变多,审批时间通常还要更长。这是正常周期,不是拖延——只有超出原计划、反复退件、方案重做,才叫拖延。我们自己的项目大多数按计划走完,也有拖过的,拖掉的都是真金白银。

        第二笔是完整开发周期。审批走完不等于能收租,后面还有建筑贷款、拆除或场地准备、主体施工、验收、招租。所以从买地到真正产生租金,要按年来计算。

        组合台账记录了每宗的买入日期和启动出租日期,两者之差就是这第二笔账——从取得物业到形成租金收入的完整周期,设计、审批、融资、施工、招租都在里面;它不是单独的审批时间,也不是现场施工工期:

        独立屋改造类,快的一年,慢的两年。2017 年 11 月买入的 Highland Park 项目,2018 年四季度启动出租,一年整;2019 年底买入的 Koreatown 项目,于 2021 年四季度启动出租,两年。

