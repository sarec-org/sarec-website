  - discriminant: sectionHeading
    value:
      text: 从 53,900 到 412,413:中间隔着 36.2%
  - discriminant: prose
    value:
      md: |-
        A 项目 30 个房间的模型月租,从 1,450 到 2,150 美元不等,合计 52,300 美元,另有 16 个车位每个 100 美元。稳定运营模型下月毛收入 53,900 美元,年 646,800 美元——注意,以下全部是 Pro Forma 口径,不是实际收款记录;空置损失按毛收入的 5% 另列在运营费用里扣减,53,900 本身是减空置之前的数。

        不到 500 万成本,年收 64.7 万,毛租金回报超过 13%——如果一篇文章讲到这里就停,那是在骗你。

        往下看费用表。年运营费用 234,387 美元,占收入的 36.2%。逐项过一遍,你会发现 co-living 的费用结构和普通公寓不一样:

        物业税 60,931 美元,保险 20,400 美元,这两项谁都躲不掉。管理费按毛收入 10% 计提,64,680 美元——按我们的运营经验,市场常见水平在 6% 到 8%,模型按 10% 入,是留了余量的从紧假设。空置按 5% 计提,32,340 美元。储备金 2%,12,936 美元。到这里都还是常规项。

        再往下就是 co-living 的特色了:保洁 14,400 美元一年,耗材——清洁用品、厕纸、厨房纸、洗衣液——2,400 美元,水电煤 19,800 美元由房东承担。普通公寓这三项基本是租客自己的事。

        按房间出租,收的是"拎包入住"的钱,干的也是"拎包入住"的活。共居是重运营资产,这话要记住。

        扣完全部费用,债务偿还前现金流 412,413 美元一年,月均 34,368 美元。除以 487.4 万总成本,Yield on Cost 约 8.5%。

        这里要挂一个诚实的问号:管理费模型按 10% 入,高于市场常见水平,算是留足了;但 5% 的空置率是常规公寓的通行参数,而共居租客以年轻单身为主,换租频率天然更高,30 个房间的日常管理强度也明显高于由少量完整住宅单元构成的普通出租物业。空置这一项守不守得住,要等实际账本验证。我们正在整理已稳定项目的真实年度损益,数据出来会更新到本篇。

        模式①讲过[「开发商六重收益」](https://sinoamericanrec.org/zh/research/us-development-model-01-adu)——建筑利润、开发增值、租金现金流、资产升值、再融资释放、物管收入。放到 co-living 上,六重收益的权重排序变了:物管收入和运营平台价值明显上移。因为这个产品的租金溢价,既来自房间加公共空间的资产配置,也来自家具、水电、保洁、拎包入住这些服务供给。
